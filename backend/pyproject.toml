[project]
name = "awras-backend"
version = "1.0.0"
description = "AWRAS Backend API for annotation platforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.2",
  "fastapi>=0.121.3",
  "sqlalchemy>=2.0.44",
  "uvicorn>=0.38.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.6.1",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0.1",
  "psycopg2-binary>=2.9.10",
  "slowapi>=0.1.9",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "pyjwt>=2.8.0,<3.0.0",
  "boto3>=1.42.42",
  "asyncpg>=0.31.0",
  "psycopg>=3.3.2",
  "python-keycloak>=7.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "testcontainers>=3.7.0",
]
